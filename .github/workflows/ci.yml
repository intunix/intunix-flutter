name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
jobs:
  dart-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build the example for Android
        working-directory: example
        run: flutter build apk --debug

  ios:
    runs-on: macos-15
    steps:
      # The folder must be named like the plugin: Swift Package Manager takes a local
      # package's identity from its directory name.
      - uses: actions/checkout@v4
        with: { path: intunix_flutter }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter config --enable-swift-package-manager
      - name: Build the example for the iOS simulator
        working-directory: intunix_flutter/example
        run: |
          set -o pipefail
          flutter build ios --simulator --debug 2>&1 | tee "$RUNNER_TEMP/ios.log" || {
            grep -E -A6 "error:|Error " "$RUNNER_TEMP/ios.log" | head -n 40 | while read -r l; do [ -n "$l" ] && echo "::error::$l"; done
            exit 1
          }
          # Fail unless the plugin really went through Swift Package Manager.
          grep -rq "intunix_flutter" ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
          grep -q "intunix-ios" ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved 2>/dev/null \
            && echo "::notice::intunix-ios resolved via SPM" || echo "::notice::Package.resolved not found where expected"

  # A fresh app installing the plugin the way users do (git dependency), to prove the iOS
  # Swift package resolves from the pub cache, not just from this checkout.
  consumer-git:
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter config --enable-swift-package-manager
      - name: Create an app that depends on this commit
        run: |
          flutter create --platforms=ios,android consumer
          cd consumer
          perl -0pi -e 's/^dependencies:\n/dependencies:\n  intunix_flutter: any\n/m' pubspec.yaml
          cat >> pubspec.yaml <<YAML
          dependency_overrides:
            intunix_flutter:
              git:
                url: https://github.com/${{ github.repository }}
                ref: ${{ github.sha }}
          YAML
          flutter pub get
      - name: Build it for the iOS simulator
        working-directory: consumer
        run: |
          flutter build ios --simulator --debug > "$RUNNER_TEMP/c.log" 2>&1 || {
            grep -E -A6 "error:|Error " "$RUNNER_TEMP/c.log" | head -n 40 | while read -r l; do [ -n "$l" ] && echo "::error::$l"; done
            exit 1
          }
          # Fail unless the plugin really went through Swift Package Manager.
          grep -rq "intunix_flutter" ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
          grep -q "intunix-ios" ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved 2>/dev/null \
            && echo "::notice::intunix-ios resolved via SPM" || echo "::notice::Package.resolved not found where expected"
