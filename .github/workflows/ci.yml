name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
jobs:
  dart-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build the example for Android
        working-directory: example
        run: flutter build apk --debug

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter config --enable-swift-package-manager
      - name: Build the example for the iOS simulator
        working-directory: example
        run: |
          set -o pipefail
          flutter build ios --simulator --debug 2>&1 | tee "$RUNNER_TEMP/ios.log" || {
            grep -E -A6 "error:|Error " "$RUNNER_TEMP/ios.log" | head -n 40 | while read -r l; do [ -n "$l" ] && echo "::error::$l"; done
            exit 1
          }
